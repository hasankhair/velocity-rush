<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1f65" />
    <title>Velocity Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-card" aria-label="Velocity Rush game">
        <header class="hud">
          <div class="brand"><span>VELOCITY</span> RUSH</div>
          <div class="stats" aria-live="polite">
            <div><small>SCORE</small><strong id="score">000000</strong></div>
            <div><small>RINGS</small><strong id="rings">00</strong></div>
            <div><small>TIME</small><strong id="time">0:00</strong></div>
          </div>
          <button class="sound-button" id="sound" aria-label="Toggle sound">♫</button>
        </header>
        <canvas id="game" width="1280" height="720" aria-label="Side-scrolling platform game"></canvas>
        <div class="overlay" id="overlay">
          <div class="title-mark">VELOCITY<br /><em>RUSH</em></div>
          <p>BLAST THROUGH THE EMERALD COAST</p>
          <button id="start">PLAY NOW <span>→</span></button>
          <div class="how-to"><kbd>←</kbd><kbd>→</kbd> RUN &nbsp; <kbd>SPACE</kbd> JUMP</div>
        </div>
        <div class="mobile-controls" aria-label="Touch controls">
          <div class="dpad"><button data-key="ArrowLeft">◀</button><button data-key="ArrowRight">▶</button></div>
          <button class="jump" data-key="Space">JUMP</button>
        </div>
      </section>
      <p class="tip">Collect rings · Defeat bots by jumping on them · Reach the finish flag!</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
